name: Build CacheKeeper (Roothide)
# macos-15-intel = Intel runner, standard label, available to private Free repos.
# macos-14 retired 2026-11-02 and was ARM-only; macos-13 retired 2025-12-04.
# macOS 15 image ships Xcode 16.0-16.4 + 26.x only (default 16.4) - no Xcode 15.x,
# so setup-xcode must ask for 16.4. Theos still uses the cloned iPhoneOS16.5.sdk.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos-roothide

jobs:
  build:
    name: Build roothide deb
    runs-on: macos-15-intel

    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes" >> "$HOME/.theosrc"

      - name: Checkout Theos (RootHide)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive

      - name: Install iOS SDK (iPhoneOS16.5)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "iPhoneOS16.5.sdk already present"
            exit 0
          fi
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"

      - name: Install Theos dependencies
        run: |
          brew install ldid dpkg xz
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      # 本工程的 Makefile 已写死 THEOS_PACKAGE_SCHEME = roothide，
      # 编译命令与交接说明一致，不需要再传 scheme。
      - name: Build Package
        run: |
          set -euo pipefail
          command -v ldid
          make clean
          make package THEOS_PACKAGE_DIR="$PWD/packages"
          echo "=== .deb files ==="
          find ./packages -name "*.deb" -type f

      - name: Inspect deb
        run: |
          set -euo pipefail
          for deb in ./packages/*.deb; do
            echo "--- $deb ---"
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CacheKeeper-deb
          path: ./packages/*.deb
          if-no-files-found: error
