name: 构建 CacheKeeper RootHide

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      native_only:
        description: '只验证已上传 ref 的全部原生套件；不运行 UIKit、编译 deb 或发布'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cachekeeper-${{ github.ref }}-${{ inputs.native_only == true && 'native' || 'full' }}
  cancel-in-progress: true

jobs:
  native:
    name: 全部原生回归与结果汇总
    runs-on: macos-15-intel
    # The image fixture adds a separate MRC object; its group permits all four
    # native variants plus that compilation before publishing its result.
    timeout-minutes: 35
    steps:
      - name: 获取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 验证原生测试编排
        run: |
          python3 tests/test_native_orchestration.py
          python3 tests/test_image_runtime_orchestration.py
          python3 tests/test_exact_failure_control.py

      - name: 原生回归测试
        run: |
          mkdir -p tmp/native-results
          set -o pipefail
          python3 tests/run_native_tests.py --output tmp/native-results 2>&1 | tee tmp/native-tests.log

      - name: 保存原生回归日志与汇总
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-log
          path: |
            tmp/native-tests.log
            tmp/native-results/*.log
            tmp/native-results/summary.json
          if-no-files-found: warn

  capacity-page:
    name: 容量页面精确反例与行为回归
    needs: native
    if: inputs.native_only != true
    runs-on: macos-15-intel
    # Discovery 300 + boot 60 + readiness 420 + 3*(generate 60 + build 600 +
    # test 420 + summary 60) = 4200s/70m. Runner step adds 2m overhead;
    # checkout 3 + tools 8 + runner 72 + upload 5 = 88m within this 90m job.
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
    steps:
      - name: 获取源码
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: 准备容量页面工具
        timeout-minutes: 8
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: 运行容量页面回归
        timeout-minutes: 72
        run: |
          python3 tests/test_capacity_page_orchestration.py
          python3 tests/run_capacity_page_tests.py

      - name: 保存容量页面回归结果
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: capacity-page-results
          path: |
            tmp/feedback-1792/capacity-page-*.log
            tmp/feedback-1792/capacity-page-*-summary.json
            tmp/feedback-1792/capacity-page-*/prepare*.log
            tmp/feedback-1792/capacity-page-*/prepare-summary.json
            tmp/feedback-1792/capacity-page-*/**/build.log
            tmp/feedback-1792/capacity-page-*/**/test.log
            tmp/feedback-1792/capacity-page-*/**/Results.xcresult
          if-no-files-found: warn

  uikit:
    name: UIKit 全套断言与 SDK 兼容回归
    needs: native
    if: inputs.native_only != true
    runs-on: macos-15-intel
    # Runner command maxima total 10380s; <=29 owned-group stops add <=174s.
    # Runner deadline 10700s < step 180m. Checkout3 + tools8 + checks2 + run180
    # + immutable archive3 + upload5 = 201m, within the 210m job budget.
    timeout-minutes: 210
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
    steps:
      - name: 获取源码
        timeout-minutes: 3
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 UIKit 工具
        timeout-minutes: 8
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: 验证 UIKit 编排与进程收尾
        timeout-minutes: 2
        run: |
          python3 tests/test_ui_orchestration.py
          python3 tests/test_ui_process_lifecycle.py
          python3 tests/test_cleanup_summary_diagnostics.py

      - name: UIKit 点按与键盘回归
        timeout-minutes: 180
        run: exec python3 tests/run_ui_tests.py

      - name: 固化 UIKit 回归产物
        if: always()
        timeout-minutes: 3
        run: exec python3 tests/run_ui_tests.py --archive-only

      - name: 保存 UIKit 回归结果
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: UIKit-input-results
          # Upload closed files only; never traverse a live/incomplete xcresult/Staging.
          path: |
            tmp/ui-artifacts/UIKit-results.tar.gz
            tmp/ui-artifacts/archive-summary.json
            tmp/input-ui-tests/run-summary.json
          if-no-files-found: warn

  build:
    name: 测试、编译与检查 deb
    needs: [native, uikit]
    if: inputs.native_only != true
    # macos-15 的 arm64 池连续未分配 runner；宿主改为 Intel，设备目标仍由 Makefile 定义。
    runs-on: macos-15-intel
    # UIKit has its own complete budget; package/release still require its success.
    timeout-minutes: 60
    env:
      THEOS: ${{ github.workspace }}/tmp/theos
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 获取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取 RootHide Theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: tmp/theos
          submodules: recursive
          persist-credentials: false

      - name: 获取 iPhoneOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: tmp/ios-sdks
          sparse-checkout: iPhoneOS16.5.sdk
          persist-credentials: false

      - name: 准备工具链
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid dpkg xz
          test -d tmp/ios-sdks/iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R tmp/ios-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          command -v ldid
          command -v dpkg-deb

      - name: 生成本次包版本
        id: version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path('control')
          text = path.read_text(encoding='utf-8')
          base = re.search(r'^Version: (\S+)$', text, re.M).group(1)
          version = f"{base}-{os.environ['BUILD_NUMBER']}.{os.environ['BUILD_ATTEMPT']}"
          path.write_text(re.sub(r'^Version: .*$', f'Version: {version}', text, flags=re.M), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'version={version}', file=output)
          print(f'构建版本：{version}')
          PY

      - name: 编译 RootHide 包
        shell: bash
        run: |
          set -euo pipefail
          # 通过网页/连接器推送的文件会丢失可执行位，deb 打包前先修复维护脚本权限（git 推送时本就是 755，此步无副作用）
          chmod 0755 layout/DEBIAN/postinst layout/DEBIAN/prerm
          make clean
          make package THEOS_PACKAGE_DIR="$PWD/packages"

      - name: 验证 deb 内容
        run: python3 scripts/verify_deb.py packages

      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CacheKeeper-RootHide-${{ steps.version.outputs.version }}
          path: packages/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布可下载测试包
    needs: [build, capacity-page]
    if: inputs.native_only != true && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: 获取源码与发布历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 取得验证后的产物
        uses: actions/download-artifact@v4
        with:
          name: CacheKeeper-RootHide-${{ needs.build.outputs.version }}
          path: packages

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_release_notes.py --version "$PACKAGE_VERSION" \
            --source "$SOURCE_SHA" --repository "$GH_REPO" --output packages/CHANGELOG.md
          cat >> packages/CHANGELOG.md <<EOF

          ## 构建与使用说明

          自动构建的 CacheKeeper RootHide 测试包，目标 iOS 16–17。

          - 构建记录：$RUN_URL
          - 已完成：macOS 原生回归、Theos 编译、deb 文件检查。
          - 尚未完成：iOS 真机注入与功能验收。

          已启用 APP 的 Library/Caches、tmp 按平台缓存用途清理，旧 fullClear 不再是前提；草稿、唯一副本、必要业务状态和用户排除优先保留。
          auto / prevent / clean 共用引擎，处理存量与新增缓存；不再施加通用目录写锁，旧权限按记录恢复。模式切换保留独立 NSURLCache 选项。已核实的 SDWebImage 标准图片缓存随 APP 总开关、模式与目录选择执行：auto / prevent 限制其磁盘写入，clean 和关闭后保持原调用；后台清理在真实 SDK 串行队列执行前复核当前授权与保留范围，不清内存。独立默认关闭的网页磁盘缓存回收选项，经授权在 APP 切后台时调用真实 WebView 的系统 DiskCache 接口。SDK 和网页 API 完成不代表已测得释放空间。
          未识别的非标准资源仍需真实 APP 规则与恢复证据，不代表任意 APP 均已适配。

          真机测试与反馈步骤：仓库 docs/2026-11-13-真机验收.md。

          下载下方 .deb 文件；SHA256SUMS 可用于完整性校验。
          EOF
          gh release create "v$PACKAGE_VERSION" packages/*.deb packages/SHA256SUMS packages/package-contents.txt packages/CHANGELOG.md \
            --repo "$GH_REPO" --target "$SOURCE_SHA" --prerelease \
            --title "缓存管家 $PACKAGE_VERSION · RootHide" --notes-file packages/CHANGELOG.md
