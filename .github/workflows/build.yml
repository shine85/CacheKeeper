name: 构建 CacheKeeper RootHide

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cachekeeper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 测试、编译与检查 deb
    # macos-15 的 arm64 池连续未分配 runner；宿主改为 Intel，设备目标仍由 Makefile 定义。
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      THEOS: ${{ github.workspace }}/tmp/theos
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 获取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 验证回执展示失败基线
        run: |
          mkdir -p tmp
          python3 tests/run_presentation_red.py

      - name: 验证配置执行边界红绿回归
        run: python3 tests/run_configuration_red.py

      - name: 验证新增应用诊断遗漏基线
        run: python3 tests/run_diagnostics_red.py

      - name: 验证网络缓存初始化限制基线
        run: python3 tests/run_network_initialization_red.py

      - name: 原生回归测试
        run: |
          set -o pipefail
          python3 tests/run_native_tests.py 2>&1 | tee tmp/native-tests.log

      - name: 保存原生回归日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-log
          path: tmp/native-tests.log
          if-no-files-found: ignore

      - name: UIKit 点按与键盘回归
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 tests/run_ui_tests.py

      - name: 保存 UIKit 回归结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UIKit-input-results
          path: tmp/input-ui-tests/Results.xcresult
          if-no-files-found: ignore

      - name: 获取 RootHide Theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: tmp/theos
          submodules: recursive
          persist-credentials: false

      - name: 获取 iPhoneOS 16.5 SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: tmp/ios-sdks
          sparse-checkout: iPhoneOS16.5.sdk
          persist-credentials: false

      - name: 准备工具链
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid dpkg xz
          test -d tmp/ios-sdks/iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R tmp/ios-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          command -v ldid
          command -v dpkg-deb

      - name: 生成本次包版本
        id: version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path('control')
          text = path.read_text(encoding='utf-8')
          base = re.search(r'^Version: (\S+)$', text, re.M).group(1)
          version = f"{base}-{os.environ['BUILD_NUMBER']}.{os.environ['BUILD_ATTEMPT']}"
          path.write_text(re.sub(r'^Version: .*$', f'Version: {version}', text, flags=re.M), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'version={version}', file=output)
          print(f'构建版本：{version}')
          PY

      - name: 编译 RootHide 包
        shell: bash
        run: |
          set -euo pipefail
          # 通过网页/连接器推送的文件会丢失可执行位，deb 打包前先修复维护脚本权限（git 推送时本就是 755，此步无副作用）
          chmod 0755 layout/DEBIAN/postinst layout/DEBIAN/prerm
          make clean
          make package THEOS_PACKAGE_DIR="$PWD/packages"

      - name: 验证 deb 内容
        run: python3 scripts/verify_deb.py packages

      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CacheKeeper-RootHide-${{ steps.version.outputs.version }}
          path: packages/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布可下载测试包
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: 获取源码与发布历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 取得验证后的产物
        uses: actions/download-artifact@v4
        with:
          name: CacheKeeper-RootHide-${{ needs.build.outputs.version }}
          path: packages

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_release_notes.py --version "$PACKAGE_VERSION" \
            --source "$SOURCE_SHA" --repository "$GH_REPO" --output packages/CHANGELOG.md
          cat >> packages/CHANGELOG.md <<EOF

          ## 构建与使用说明

          自动构建的 CacheKeeper RootHide 测试包，目标 iOS 16–17。

          - 构建记录：$RUN_URL
          - 已完成：macOS 原生回归、Theos 编译、deb 文件检查。
          - 尚未完成：iOS 真机注入与功能验收。

          已启用 APP 的 Library/Caches、tmp 按平台缓存用途清理，旧 fullClear 不再是前提；草稿、唯一副本、必要业务状态和用户排除优先保留。
          auto / prevent / clean 共用引擎，处理存量与新增缓存；不再施加通用目录写锁，旧权限按记录恢复。模式切换保留独立网络选项，网络限制仅针对 NSURLCache。
          未识别的非标准资源仍需真实 APP 规则与恢复证据，不代表任意 APP 均已适配。

          真机测试与反馈步骤：仓库 docs/2026-11-13-真机验收.md。

          下载下方 .deb 文件；SHA256SUMS 可用于完整性校验。
          EOF
          gh release create "v$PACKAGE_VERSION" packages/*.deb packages/SHA256SUMS packages/package-contents.txt packages/CHANGELOG.md \
            --repo "$GH_REPO" --target "$SOURCE_SHA" --prerelease \
            --title "缓存管家 $PACKAGE_VERSION · RootHide" --notes-file packages/CHANGELOG.md
