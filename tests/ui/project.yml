name: CacheKeeperInputTests
options:
  bundleIdPrefix: dev.local.cachekeeper.tests
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    CLANG_ENABLE_OBJC_ARC: YES
    WARNING_CFLAGS: "$(inherited) -Werror=format"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  SDWebImage:
    url: https://github.com/SDWebImage/SDWebImage.git
    revision: 2de3a496eaf6df9a1312862adcfd54acd73c39c0
targets:
  InputHarness:
    type: application
    platform: iOS
    info:
      path: InputHarness-Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
    sources:
      - path: ../../tests/ui/InputHarness.m
      - path: ../../Prefs/Settings.m
      - path: ../../Prefs/SearchInput.m
      - path: ../../Prefs/SearchDiagnostics.m
      - path: ../../Prefs/SearchHitRouting.m
      - path: ../../Prefs/DiagnosticsPage.m
      - path: ../../AxsCacheKeeperDiagnostics.m
      - path: ../../AxsCacheKeeperInjectionConditions.m
      - path: ../../AxsCacheKeeperStorageInventory.m
      - path: ../../AxsCacheKeeperHostEvidence.m
      - path: ../../AxsCacheKeeperOperationInfo.m
      - path: ../../AxsCacheKeeperAppList.m
      - path: ../../AxsCacheKeeperInstallation.m
      - path: ../../AxsCacheKeeperDiagnosticChannel.m
      - path: ../../AxsCacheKeeperPDFSession.m
      - path: ../../AxsCacheKeeperPDFInspection.m
    dependencies:
      - sdk: QuartzCore.framework
    settings:
      base:
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../../tests/ui/include $(SRCROOT)/../../tests/include"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) AXS_CACHEKEEPER_PDF_CLIENT=1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  InputUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../../tests/ui/InputUITests.swift
      - path: ../../tests/ui/SearchRoutingUITests.swift
    dependencies:
      - target: InputHarness
    settings:
      base:
        TEST_TARGET_NAME: InputHarness
  SearchProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../tests/ui/SearchProbeTests.m
      - path: ../../tests/ui/WebKitProbeTests.m
      - path: ../../AxsCacheKeeperOperationInfo.m
      - path: ../../AxsCacheKeeperWebKitCache.m
      - path: ../../AxsCacheKeeperWebKitObservation.m
      - path: ../../AxsCacheKeeperWebKitCoordinator.m
    dependencies:
      - target: InputHarness
      - sdk: WebKit.framework
    settings:
      base:
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../../tests/ui/include $(SRCROOT)/../../tests/include"
  ScanPageTests:
    type: bundle.unit-test
    platform: iOS
    info:
      path: ScanPageTests-Info.plist
      properties:
        CacheKeeperPackageVersion: "0.7.2-167.1"
        CFBundleShortVersionString: "0.7.2"
    sources:
      - path: ../../tests/ui/ScanPageTests.m
      - path: ../../tests/ui/CapacityPageTests.m
      - path: ../../tests/ui/ScanHostEvidenceBoundary.m
      - path: ../../Prefs/InspectionPage.m
    dependencies:
      - target: InputHarness
    settings:
      base:
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../../tests/ui/include $(SRCROOT)/../../tests/include"
  WebKitIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../tests/ui/WebKitIntegrationTests.m
      - path: ../../AxsCacheKeeperOperationInfo.m
      - path: ../../AxsCacheKeeperWebKitCache.m
      - path: ../../AxsCacheKeeperWebKitObservation.m
      - path: ../../AxsCacheKeeperWebKitCoordinator.m
    dependencies:
      - target: InputHarness
      - sdk: WebKit.framework
    settings:
      base:
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../../tests/ui/include $(SRCROOT)/../../tests/include"
  ImageCacheIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../tests/ui/ImageCacheIntegrationTests.m
      - path: ../../tests/ui/ScaledRepresentationRebuildTests.m
      - path: ../../AxsCacheKeeperOperationInfo.m
      - path: ../../AxsCacheKeeperImageCache.m
      - path: ../../AxsCacheKeeperImageCacheRuntime.m
      - path: ../../AxsCacheKeeperImageCoordinator.m
      - path: ../../AxsCacheKeeperCleanupRules.m
    dependencies:
      - target: InputHarness
      - package: SDWebImage
        product: SDWebImage
      - sdk: ImageIO.framework
    settings:
      base:
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../../tests/ui/include $(SRCROOT)/../../tests/include"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) AXS_CACHEKEEPER_IMAGE_TESTING=1"
schemes:
  InputHarness:
    build:
      targets:
        InputHarness: all
    test:
      targets:
        - SearchProbeTests
        - ScanPageTests
        - WebKitIntegrationTests
        - ImageCacheIntegrationTests
        - InputUITests
