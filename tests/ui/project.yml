name: CacheKeeperInputTests
options:
  bundleIdPrefix: dev.local.cachekeeper.tests
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    CLANG_ENABLE_OBJC_ARC: YES
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  InputHarness:
    type: application
    platform: iOS
    sources:
      - path: InputHarness.m
      - path: ../../Prefs/Settings.m
      - path: ../../Prefs/DiagnosticsPage.m
      - path: ../../AxsCacheKeeperDiagnostics.m
      - path: ../../AxsCacheKeeperAppList.m
    settings:
      base:
        HEADER_SEARCH_PATHS: "$(SRCROOT)/include $(SRCROOT)/../include"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  InputUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: InputUITests.swift
    dependencies:
      - target: InputHarness
    settings:
      base:
        TEST_TARGET_NAME: InputHarness
schemes:
  InputHarness:
    build:
      targets:
        InputHarness: all
    test:
      targets:
        - InputUITests
